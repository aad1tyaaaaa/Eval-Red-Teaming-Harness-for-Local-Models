[project]
name = "evalh"
version = "0.1.0"
description = "Eval & red-teaming harness for comparing local models (A vs B)"
requires-python = ">=3.11"
dependencies = ["typer>=0.12", "httpx>=0.27", "pydantic>=2.6", "pyyaml>=6"]

[project.scripts]
evalh = "evalh.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
